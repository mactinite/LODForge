[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/ui"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
lodforge-esp = { path = "crates/esp" }
lodforge-archive = { path = "crates/archive" }
lodforge-nif = { path = "crates/nif" }
lodforge-dds = { path = "crates/dds" }
lodforge-gpu = { path = "crates/gpu" }
lodforge-terrain = { path = "crates/terrain" }
lodforge-objlod = { path = "crates/objlod" }
lodforge-treelod = { path = "crates/treelod" }
lodforge-seasons = { path = "crates/seasons" }
lodforge-core = { path = "crates/core" }
lodforge-btr = { path = "crates/btr" }
lodforge-grass = { path = "crates/grass" }
lodforge-dyndolod = { path = "crates/dyndolod" }
lodforge-texgen = { path = "crates/texgen" }
lodforge-lodmodel = { path = "crates/lodmodel" }
lodforge-treemodel = { path = "crates/treemodel" }
lodforge-viewer = { path = "crates/viewer" }
lodforge-instances = { path = "crates/instances" }
anyhow = "1"
half = "2"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = "25"
winit = "0.30"
egui = "0.32"
egui-wgpu = "0.32"
egui-winit = "0.32"
glam = "0.30"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libdeflater = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "frame"] }
memmap2 = "0.9"
png = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texture2ddecoder = "0.1"
intel_tex_2 = "0.5"
thiserror = "2"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
